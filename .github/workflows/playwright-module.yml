name: Playwright Module Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module slug (energy-audits, auth, utils-lookup, hes-commands, …)
        required: true
        type: string
        default: energy-audits
      scope:
        description: All tests in the module, or @smoke only
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke

# Must grant contents: write so reusable-module-tests can deploy Allure to gh-pages.
permissions:
  contents: write

jobs:
  module-test:
    name: "${{ inputs.module }} (${{ inputs.scope }})"
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-module-tests.yml
    with:
      module: ${{ inputs.module }}
      scope: ${{ inputs.scope }}
      deploy_allure: true
      send_email: true
    secrets: inherit
