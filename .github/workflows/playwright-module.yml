name: Playwright Module Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module slug (energy-audits, auth, utils-lookup, hes-commands, …)
        required: true
        type: string
        default: energy-audits
      scope:
        description: All tests in the module, or @smoke only
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke

concurrency:
  group: module-${{ github.workflow }}-${{ github.event.inputs.module }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-test:
    name: "${{ github.event.inputs.module }} (${{ github.event.inputs.scope }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      PLAYWRIGHT_WORKERS: 1
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DEVICE_ID: ${{ secrets.DEVICE_ID }}
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      INVITE_INBOX_EMAIL: ${{ secrets.INVITE_INBOX_EMAIL }}
      INVITE_ACCEPT_TOKEN: ${{ secrets.INVITE_ACCEPT_TOKEN }}
      INVITE_E2E_EMAIL: ${{ secrets.INVITE_E2E_EMAIL }}
      INVITE_E2E_INVITATION_ID: ${{ secrets.INVITE_E2E_INVITATION_ID }}
      REPORT_MAIL_TO: vamsibst@gmail.com
      # Green CI for known backend gaps (@backend-defect) until API fixes ship
      MASTER_DATA_SKIP_BACKEND_DEFECTS: "1"
      # PostgreSQL — optional API-vs-DB validation (set DB_* repository secrets)
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || '5432' }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME || 'mdms_indore' }}
      DB_SSL: ${{ secrets.DB_SSL || 'false' }}
      DB_ARCHIVE_NAME: ${{ secrets.DB_ARCHIVE_NAME || 'mdms_indore_archive' }}
      # Master Data — hierarchy / bulk upload / create (defaults from .env.example; override via secrets)
      BULK_DTR_ZONE_NAME: ${{ secrets.BULK_DTR_ZONE_NAME || 'Hawabangla' }}
      BULK_DTR_SUBSTATION_NAME: ${{ secrets.BULK_DTR_SUBSTATION_NAME || 'PragatiNagar' }}
      BULK_DTR_FEEDER_NAME: ${{ secrets.BULK_DTR_FEEDER_NAME || 'PARMANU NAGAR(CHQ)' }}
      BULK_DTR_MAIN_SUB_METER: ${{ secrets.BULK_DTR_MAIN_SUB_METER || 'Main' }}
      BULK_DTR_METER_PHASE: ${{ secrets.BULK_DTR_METER_PHASE || '1 PH' }}
      BULK_METER_MANUFACTURER_NAME: ${{ secrets.BULK_METER_MANUFACTURER_NAME || 'L&T' }}
      BULK_CONSUMER_DTR_NAME: ${{ secrets.BULK_CONSUMER_DTR_NAME || 'RJ662' }}
      BULK_CONSUMER_CATEGORY_NAME: ${{ secrets.BULK_CONSUMER_CATEGORY_NAME || 'Commercial' }}
      BULK_CONSUMER_CONNECTION_STATUS_NAME: ${{ secrets.BULK_CONSUMER_CONNECTION_STATUS_NAME || 'Connected' }}
      BULK_CONSUMER_CONNECTION_TYPE_NAME: ${{ secrets.BULK_CONSUMER_CONNECTION_TYPE_NAME || 'Prepaid' }}
      BULK_CONSUMER_BILLING_CYCLE_NAME: ${{ secrets.BULK_CONSUMER_BILLING_CYCLE_NAME || 'Monthly' }}
      BULK_CONSUMER_TOD_NAME: ${{ secrets.BULK_CONSUMER_TOD_NAME || 'NO TOD LT' }}
      CREATE_DTR_ORGANISATION_LOOKUP_ID: ${{ secrets.CREATE_DTR_ORGANISATION_LOOKUP_ID || '30' }}
      CREATE_DTR_SUBSTATION_NETWORK_LOOKUP_ID: ${{ secrets.CREATE_DTR_SUBSTATION_NETWORK_LOOKUP_ID || '3' }}
      CREATE_DTR_FEEDER_NETWORK_LOOKUP_ID: ${{ secrets.CREATE_DTR_FEEDER_NETWORK_LOOKUP_ID || '4' }}
      CREATE_DTR_EXISTS_CODE: ${{ secrets.CREATE_DTR_EXISTS_CODE || 'RJ662' }}
      CREATE_DTR_MAIN_SUB_METER_TBL_REF_ID: ${{ secrets.CREATE_DTR_MAIN_SUB_METER_TBL_REF_ID || '1' }}
      CREATE_DTR_METER_PHASE_TBL_REF_ID: ${{ secrets.CREATE_DTR_METER_PHASE_TBL_REF_ID || '1' }}
      CREATE_METER_DEVICE_MANUFACTURER_TBL_REF_ID: ${{ secrets.CREATE_METER_DEVICE_MANUFACTURER_TBL_REF_ID || '2' }}
      CREATE_METER_METER_MODEL_TBL_REF_ID: ${{ secrets.CREATE_METER_METER_MODEL_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_ORGANISATION_LOOKUP_ID: ${{ secrets.CREATE_CONSUMER_ORGANISATION_LOOKUP_ID || '30' }}
      CREATE_CONSUMER_CATEGORY_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_CATEGORY_TBL_REF_ID || '3' }}
      CREATE_CONSUMER_CONNECTION_STATUS_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_CONNECTION_STATUS_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_METER_PHASE_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_METER_PHASE_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_CONNECTION_TYPE_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_CONNECTION_TYPE_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_BILLING_CYCLE_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_BILLING_CYCLE_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_TOD_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_TOD_TBL_REF_ID || '1' }}
      CREATE_CONSUMER_MAIN_SUB_METER_TBL_REF_ID: ${{ secrets.CREATE_CONSUMER_MAIN_SUB_METER_TBL_REF_ID || '1' }}
      # Master Data — validate-meter serials (environment-specific; set as repository secrets)
      VALIDATE_DTR_METER_VALID_SERIAL: ${{ secrets.VALIDATE_DTR_METER_VALID_SERIAL }}
      VALIDATE_DTR_METER_ON_DTR_SERIAL: ${{ secrets.VALIDATE_DTR_METER_ON_DTR_SERIAL }}
      VALIDATE_DTR_METER_INACTIVE_SERIAL: ${{ secrets.VALIDATE_DTR_METER_INACTIVE_SERIAL }}
      VALIDATE_DTR_METER_ASSIGNED_SERIAL: ${{ secrets.VALIDATE_DTR_METER_ASSIGNED_SERIAL }}
      VALIDATE_ADD_METER_VALID_SERIAL: ${{ secrets.VALIDATE_ADD_METER_VALID_SERIAL }}
      VALIDATE_ADD_METER_EXISTS_SERIAL: ${{ secrets.VALIDATE_ADD_METER_EXISTS_SERIAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure these under Settings → Secrets and variables → Actions → Repository secrets:$missing"
            echo "See README.md → CI (GitHub Actions) for details."
            exit 1
          fi

      - name: Log optional CI configuration
        run: |
          echo "=== Optional CI configuration ==="
          optional_missing=""
          [ -z "$DB_HOST" ] && optional_missing="$optional_missing DB_HOST DB_USER DB_PASSWORD"
          [ -z "$VALIDATE_DTR_METER_VALID_SERIAL" ] && optional_missing="$optional_missing VALIDATE_DTR_METER_*"
          [ -z "$VALIDATE_ADD_METER_VALID_SERIAL" ] && optional_missing="$optional_missing VALIDATE_ADD_METER_*"
          if [ -z "$GMAIL_IMAP_USER" ] && [ -z "$INVITE_ACCEPT_TOKEN" ]; then
            optional_missing="$optional_missing GMAIL_IMAP_* or INVITE_ACCEPT_TOKEN"
          fi
          if [ -n "$optional_missing" ]; then
            echo "::notice title=Optional secrets not set::Tests that need these will skip:$optional_missing"
          else
            echo "All optional secrets configured."
          fi
          echo "Module: ${{ github.event.inputs.module }} (scope: ${{ github.event.inputs.scope }})"
          echo "MASTER_DATA_SKIP_BACKEND_DEFECTS=$MASTER_DATA_SKIP_BACKEND_DEFECTS"
          echo "Master Data hierarchy: zone=$BULK_DTR_ZONE_NAME substation=$BULK_DTR_SUBSTATION_NAME feeder=$BULK_DTR_FEEDER_NAME"
          echo "Create DTR lookups: org=$CREATE_DTR_ORGANISATION_LOOKUP_ID substation=$CREATE_DTR_SUBSTATION_NETWORK_LOOKUP_ID feeder=$CREATE_DTR_FEEDER_NETWORK_LOOKUP_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: List available modules
        run: node scripts/run-module-tests.mjs list

      - name: Run module tests
        run: |
          SCOPE="${{ github.event.inputs.scope }}"
          MODULE="${{ github.event.inputs.module }}"
          if [ "$SCOPE" = "smoke" ]; then
            node scripts/run-module-tests.mjs "$MODULE" --smoke
          else
            node scripts/run-module-tests.mjs "$MODULE"
          fi

      - name: Write Allure environment
        if: always()
        run: node scripts/write-allure-environment.mjs

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Zip Allure report for artifact
        if: always()
        run: |
          if [ -d allure-report ]; then
            zip -r allure-report.zip allure-report
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.module }}-${{ github.event.inputs.scope }}
          path: |
            playwright-report/
            reports/playwright-results.json
            test-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.module }}-${{ github.event.inputs.scope }}
          path: |
            allure-report/
            allure-results/
            allure-report.zip
          retention-days: 14

      - name: Deploy Allure to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  send-report-email:
    name: Email module Allure report
    runs-on: ubuntu-latest
    needs: module-test
    if: always()

    env:
      REPORT_MAIL_TO: vamsibst@gmail.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Playwright results for email summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ github.event.inputs.module }}-${{ github.event.inputs.scope }}
          path: artifact

      - name: Restore results JSON for email body
        if: always()
        run: |
          mkdir -p reports
          if [ -f artifact/reports/playwright-results.json ]; then
            cp artifact/reports/playwright-results.json reports/playwright-results.json
          fi

      - name: Build email summary
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ needs.module-test.result }}
          ALLURE_REPORT_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          MODULE_NAME: ${{ github.event.inputs.module }}
          MODULE_SCOPE: ${{ github.event.inputs.scope }}
        run: node scripts/build-allure-email-body.mjs

      - name: Check report email configuration
        id: email_config
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$REPORT_MAIL_TO" ] && [ -n "$SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Allure report email
        if: steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ needs.module-test.result }}] Playwright Module ${{ github.event.inputs.module }} (${{ github.event.inputs.scope }}) —
            ${{ github.repository }} (${{ github.ref_name }})
          to: ${{ env.REPORT_MAIL_TO }}
          from: ${{ secrets.REPORT_MAIL_FROM || secrets.SMTP_USERNAME }}
          html_body: file://reports/allure-email-body.html
          secure: true

      - name: Email skipped notice
        if: steps.email_config.outputs.enabled != 'true'
        run: |
          echo "Report email not sent — configure SMTP_* repository secrets (recipient: $REPORT_MAIL_TO)."
