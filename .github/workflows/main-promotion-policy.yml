name: Main Promotion Policy

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: main-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-promotion-policy:
    name: Main Promotion Policy
    runs-on: ubuntu-latest
    steps:
      - name: Require source branch QA
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #$PR_NUMBER: $SOURCE_BRANCH → $TARGET_BRANCH"

          if [ "$SOURCE_BRANCH" != "QA" ]; then
            echo "::error title=Main promotion blocked::Pull requests into $TARGET_BRANCH must come from QA (got '$SOURCE_BRANCH')."
            echo "Flow: feature branch → PR to QA → merge → PR from QA to main → merge → full regression on push."
            exit 1
          fi

          echo "Promotion source is QA."
