name: Playwright API Tests

# How runs are selected
# - push to main/master → static + smoke + all modules (full framework)
# - pull_request        → static + smoke only (fast feedback)
# - schedule (nightly)  → smoke + all modules
# - Actions → Run workflow:
#     Smoke          → @smoke only
#     Module         → one module from the dropdown
#     Full framework → smoke + every module

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly 18:30 UTC (~00:00 IST)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: What to run
        required: true
        type: choice
        default: all
        options:
          - smoke
          - module
          - all
      module:
        description: Module name (only when What to run = module)
        required: true
        type: choice
        default: dashboard
        options:
          - alarms-and-events
          - asset-management
          - audit-logs
          - auth
          - billing
          - collection-report
          - commericial-analysis
          - consumers
          - consumption
          - data-validation
          - dashboard
          - dtrs
          - dtr-load
          - energy-audits
          - feeder
          - hes-commands
          - master-data
          - meter-replacement
          - mis-dashboard
          - modules-permissions
          - notifications
          - overall-dashboard
          - reports
          - revenue-protection
          - role-permissions
          - technical-analysis
          - users-admin
          - users-profile-image
          - utils-lookup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.run_mode || 'auto' }}-${{ github.event.inputs.module || 'none' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  WORKERS: "1"
  PLAYWRIGHT_WORKERS: "1"
  OBS_DISABLED: "1"
  # Do not set API_TEST_PRINT_RESPONSE in CI (avoids dumping response bodies in logs).
  BASE_URL: ${{ secrets.BASE_URL }}
  STRIP_INDORE_PREFIX: ${{ vars.STRIP_INDORE_PREFIX || 'true' }}
  EMAIL: ${{ secrets.EMAIL }}
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  LOGIN_TESTER_PASSKEY: ${{ secrets.LOGIN_TESTER_PASSKEY || vars.LOGIN_TESTER_PASSKEY }}
  TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
  DEVICE_ID: ${{ secrets.DEVICE_ID }}
  GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
  GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
  INVITE_INBOX_EMAIL: ${{ secrets.INVITE_INBOX_EMAIL }}
  INVITE_ACCEPT_TOKEN: ${{ secrets.INVITE_ACCEPT_TOKEN }}
  INVITE_E2E_EMAIL: ${{ secrets.INVITE_E2E_EMAIL }}
  INVITE_E2E_INVITATION_ID: ${{ secrets.INVITE_E2E_INVITATION_ID }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT || '5432' }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME || 'mdms_indore' }}
  DB_SSL: ${{ secrets.DB_SSL || 'false' }}
  DB_ARCHIVE_NAME: ${{ secrets.DB_ARCHIVE_NAME || 'mdms_indore_archive' }}

jobs:
  plan:
    name: Plan run
    runs-on: ubuntu-latest
    outputs:
      run_static: ${{ steps.decide.outputs.run_static }}
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
      run_modules: ${{ steps.decide.outputs.run_modules }}
      modules_json: ${{ steps.decide.outputs.modules_json }}
      run_allure: ${{ steps.decide.outputs.run_allure }}
    steps:
      - name: Decide what to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_MODE: ${{ github.event.inputs.run_mode || '' }}
          MODULE: ${{ github.event.inputs.module || '' }}
        run: |
          ALL_MODULES='["alarms-and-events","asset-management","audit-logs","auth","billing","collection-report","commericial-analysis","consumers","consumption","data-validation","dashboard","dtrs","dtr-load","energy-audits","feeder","hes-commands","master-data","meter-replacement","mis-dashboard","modules-permissions","notifications","overall-dashboard","reports","revenue-protection","role-permissions","technical-analysis","users-admin","users-profile-image","utils-lookup"]'

          run_static=false
          run_smoke=false
          run_modules=false
          run_allure=false
          modules_json='[]'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            run_static=true
            run_smoke=true
          elif [ "$EVENT_NAME" = "push" ]; then
            # Push to main/master → full framework
            run_static=true
            run_smoke=true
            run_modules=true
            run_allure=true
            modules_json="$ALL_MODULES"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            run_smoke=true
            run_modules=true
            run_allure=true
            modules_json="$ALL_MODULES"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$RUN_MODE" in
              smoke)
                run_smoke=true
                run_allure=true
                ;;
              module)
                if [ -z "$MODULE" ]; then
                  echo "::error::module input is required when run_mode=module"
                  exit 1
                fi
                run_modules=true
                run_allure=true
                modules_json=$(printf '["%s"]' "$MODULE")
                ;;
              all)
                run_smoke=true
                run_modules=true
                run_allure=true
                modules_json="$ALL_MODULES"
                ;;
              *)
                echo "::error::Unknown run_mode: $RUN_MODE"
                exit 1
                ;;
            esac
          fi

          {
            echo "run_static=$run_static"
            echo "run_smoke=$run_smoke"
            echo "run_modules=$run_modules"
            echo "run_allure=$run_allure"
            echo "modules_json=$modules_json"
          } >> "$GITHUB_OUTPUT"

          echo "Event=$EVENT_NAME ref=$REF mode=${RUN_MODE:-auto}"
          echo "static=$run_static smoke=$run_smoke modules=$run_modules allure=$run_allure"
          echo "modules_json=$modules_json"

  static:
    name: Static (tsc · lint · unit)
    needs: plan
    if: needs.plan.outputs.run_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  smoke:
    name: Smoke (@smoke)
    needs: plan
    if: needs.plan.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure:$missing"
            exit 1
          fi
          if [ -n "$LOGIN_TESTER_PASSKEY" ]; then
            echo "LOGIN_TESTER_PASSKEY is set (length=${#LOGIN_TESTER_PASSKEY}) — login will use passkey, not captcha"
          else
            echo "::warning::LOGIN_TESTER_PASSKEY is empty — login will use captcha OCR. Add repository secret LOGIN_TESTER_PASSKEY matching the API server value."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache auth session (smoke)
        uses: actions/cache@v4
        with:
          path: playwright/.auth
          key: auth-session-${{ runner.os }}-${{ github.repository }}-smoke-v1

      - name: Typecheck
        run: npm run typecheck

      - name: Run smoke
        run: npm run test:smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            playwright-report/
            reports/playwright-results.json
            reports/defects/
            allure-results/
            test-results/
            !playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

  modules:
    name: Module ${{ matrix.module }}
    needs: [plan, smoke]
    # Smoke is optional for single-module manual runs; skip the smoke dependency when smoke was not planned.
    if: |
      always() &&
      needs.plan.outputs.run_modules == 'true' &&
      (needs.plan.outputs.run_smoke != 'true' || needs.smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module: ${{ fromJson(needs.plan.outputs.modules_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure:$missing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache auth session (${{ matrix.module }})
        uses: actions/cache@v4
        with:
          path: playwright/.auth
          key: auth-session-${{ runner.os }}-${{ github.repository }}-${{ matrix.module }}-v1

      - name: Run module suite
        run: npm run test:${{ matrix.module }}

      - name: Upload module artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.module }}
          path: |
            playwright-report/
            reports/playwright-results.json
            reports/defects/
            allure-results/
            test-results/
            !playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

  allure:
    name: Aggregate Allure
    needs: [plan, smoke, modules]
    if: |
      always() &&
      needs.plan.outputs.run_allure == 'true' &&
      (needs.plan.outputs.run_smoke != 'true' || needs.smoke.result != 'cancelled') &&
      (needs.plan.outputs.run_modules != 'true' || needs.modules.result != 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Merge allure-results
        run: |
          mkdir -p allure-results
          find downloaded-artifacts -type d -name allure-results | while read -r dir; do
            cp -n "$dir"/* allure-results/ 2>/dev/null || true
          done
          ls -la allure-results | head -50

      - name: Generate Allure report
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Allure + defects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-defects
          path: |
            allure-report/
            allure-results/
            downloaded-artifacts/**/reports/defects/
            !playwright/.auth/**
            !**/playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Deploy Allure to gh-pages
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  send-report-email:
    name: Email Allure report link
    runs-on: ubuntu-latest
    needs: [plan, allure]
    if: |
      always() &&
      needs.plan.outputs.run_allure == 'true'
    env:
      REPORT_MAIL_TO: vamsibst@gmail.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build email summary
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ needs.allure.result }}
          ALLURE_REPORT_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p reports
          cat > reports/allure-email-body.html <<EOF
          <p>Playwright pipeline: ${WORKFLOW_JOB_STATUS}</p>
          <p>Allure: <a href="${ALLURE_REPORT_URL}">${ALLURE_REPORT_URL}</a></p>
          <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
          EOF

      - name: Check report email configuration
        id: email_config
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$REPORT_MAIL_TO" ] && [ -n "$SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Allure report email
        if: steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ needs.allure.result }}] Playwright Allure Report —
            ${{ github.repository }} (${{ github.ref_name }})
          to: ${{ env.REPORT_MAIL_TO }}
          from: ${{ secrets.REPORT_MAIL_FROM || secrets.SMTP_USERNAME }}
          html_body: file://reports/allure-email-body.html
          secure: true
