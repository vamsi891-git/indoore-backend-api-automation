name: Playwright API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly 18:30 UTC (~00:00 IST)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      run_modules:
        description: After smoke, run module matrix
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  WORKERS: "1"
  PLAYWRIGHT_WORKERS: "1"
  OBS_DISABLED: "1"
  # Do not set API_TEST_PRINT_RESPONSE in CI (avoids dumping response bodies in logs).
  BASE_URL: ${{ secrets.BASE_URL }}
  STRIP_INDORE_PREFIX: ${{ vars.STRIP_INDORE_PREFIX || 'true' }}
  EMAIL: ${{ secrets.EMAIL }}
  USERNAME: ${{ secrets.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
  DEVICE_ID: ${{ secrets.DEVICE_ID }}
  GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
  GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
  INVITE_INBOX_EMAIL: ${{ secrets.INVITE_INBOX_EMAIL }}
  INVITE_ACCEPT_TOKEN: ${{ secrets.INVITE_ACCEPT_TOKEN }}
  INVITE_E2E_EMAIL: ${{ secrets.INVITE_E2E_EMAIL }}
  INVITE_E2E_INVITATION_ID: ${{ secrets.INVITE_E2E_INVITATION_ID }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT || '5432' }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME || 'mdms_indore' }}
  DB_SSL: ${{ secrets.DB_SSL || 'false' }}
  DB_ARCHIVE_NAME: ${{ secrets.DB_ARCHIVE_NAME || 'mdms_indore_archive' }}

jobs:
  static:
    name: Static (tsc · lint · unit)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  smoke:
    name: Smoke (@smoke)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure:$missing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Prove optional fence
        run: npm run prove:optional-fence

      - name: Run smoke
        run: npm run test:smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            playwright-report/
            reports/playwright-results.json
            reports/defects/
            allure-results/
            test-results/
            !playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

  modules:
    name: Module ${{ matrix.module }}
    needs: smoke
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_modules == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module:
          - alarms-and-events
          - asset-management
          - audit-logs
          - auth
          - billing
          - commericial-analysis
          - consumers
          - consumption
          - dashboard
          - dtrs
          - dtr-load
          - energy-audits
          - feeder
          - hes-commands
          - master-data
          - meter-replacement
          - mis-dashboard
          - modules-permissions
          - notifications
          - overall-dashboard
          - reports
          - revenue-protection
          - role-permissions
          - technical-analysis
          - users-admin
          - users-profile-image
          - utils-lookup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run module suite
        run: npm run test:${{ matrix.module }}

      - name: Upload module artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.module }}
          path: |
            playwright-report/
            reports/playwright-results.json
            reports/defects/
            allure-results/
            test-results/
            !playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

  allure:
    name: Aggregate Allure
    needs: [smoke, modules]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Merge allure-results
        run: |
          mkdir -p allure-results
          find downloaded-artifacts -type d -name allure-results | while read -r dir; do
            cp -n "$dir"/* allure-results/ 2>/dev/null || true
          done
          ls -la allure-results | head -50

      - name: Generate Allure report
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Allure + defects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-defects
          path: |
            allure-report/
            allure-results/
            downloaded-artifacts/**/reports/defects/
            !playwright/.auth/**
            !**/playwright/.auth/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Deploy Allure to gh-pages
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  send-report-email:
    name: Email Allure report link
    runs-on: ubuntu-latest
    needs: allure
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      REPORT_MAIL_TO: vamsibst@gmail.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build email summary
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ needs.allure.result }}
          ALLURE_REPORT_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p reports
          cat > reports/allure-email-body.html <<EOF
          <p>Playwright pipeline: ${WORKFLOW_JOB_STATUS}</p>
          <p>Allure: <a href="${ALLURE_REPORT_URL}">${ALLURE_REPORT_URL}</a></p>
          <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
          EOF

      - name: Check report email configuration
        id: email_config
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$REPORT_MAIL_TO" ] && [ -n "$SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Allure report email
        if: steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ needs.allure.result }}] Playwright Allure Report —
            ${{ github.repository }} (${{ github.ref_name }})
          to: ${{ env.REPORT_MAIL_TO }}
          from: ${{ secrets.REPORT_MAIL_FROM || secrets.SMTP_USERNAME }}
          html_body: file://reports/allure-email-body.html
          secure: true
