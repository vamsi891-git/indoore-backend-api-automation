name: Playwright API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run full API suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DEVICE_ID: ${{ secrets.DEVICE_ID }}
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      INVITE_INBOX_EMAIL: ${{ secrets.INVITE_INBOX_EMAIL }}
      REPORT_MAIL_TO: harikiran.vasupalli@bestinfra.tech

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure these under Settings → Secrets and variables → Actions → Repository secrets:$missing"
            echo "See README.md → CI (GitHub Actions) for details."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Run Playwright tests
        run: npm test

      - name: Write Allure environment
        if: always()
        run: node scripts/write-allure-environment.mjs

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Build email summary
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: node scripts/build-allure-email-body.mjs

      - name: Zip Allure report for email
        if: always()
        run: |
          if [ -d allure-report ]; then
            zip -r allure-report.zip allure-report
          else
            echo "No allure-report folder — skipping zip"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/playwright-results.json
            test-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
            allure-report.zip
          retention-days: 14

      - name: Check report email configuration
        id: email_config
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$REPORT_MAIL_TO" ] && [ -n "$SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Allure report email
        if: always() && steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ job.status }}] Playwright Allure Report —
            ${{ github.repository }} (${{ github.ref_name }})
          to: ${{ env.REPORT_MAIL_TO }}
          from: ${{ secrets.REPORT_MAIL_FROM || secrets.SMTP_USERNAME }}
          html_body: file://reports/allure-email-body.html
          secure: true
          attachments: allure-report.zip

      - name: Email skipped notice
        if: always() && steps.email_config.outputs.enabled != 'true'
        run: |
          echo "Report email not sent — configure SMTP_* repository secrets (recipient: $REPORT_MAIL_TO)."
          echo "Allure report is still available as the allure-report workflow artifact."
