name: Playwright API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run full API suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DEVICE_ID: ${{ secrets.DEVICE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing BASE_URL"
          [ -z "$PASSWORD" ] && missing="$missing PASSWORD"
          if [ -z "$EMAIL" ] && [ -z "$USERNAME" ]; then
            missing="$missing EMAIL (or USERNAME)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Actions secrets::Configure these under Settings → Secrets and variables → Actions → Repository secrets:$missing"
            echo "See README.md → CI (GitHub Actions) for details."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/playwright-results.json
            test-results/
          retention-days: 14
